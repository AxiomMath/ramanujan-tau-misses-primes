# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json

version: "v0.4"

project:
  name: "RamanujanTauMissesPrimes"
  authors: [Kenny Lau]
  description: >
    `RamanujanTauMissesPrimes` is a formal proof that the $abc$ Conjecture implies Ramanujan's
    tau function misses almost all primes. Writing
    $S(X) = \#\{\ell \le X : \ell \text{ prime},\ |\tau(n)| = \ell \text{ for some } n \ge 1\}$,
    it proves $S(X) = O(X^{13/22})$, together with the reduction of $S(X)$ to the counts
    $E_2(X)$, $E_4(X)$ of near-solutions to $x^{11} - y^2$ and $5x^{22} - u^2$, and the $abc$
    bounds $E_2(X) \ll_\eta X^{4/9+\eta}$ and $E_4(X) \ll_\eta X^{1/5+\eta}$. The Lean files were
    generated by AxiomProver, Axiom Math's in-house theorem proving system.
  responsible_maintainers: [Kenny Lau]
  license: "MIT"

repository:
  role: "substantive-development"

sources:
  - title: "ABC implies that Ramanujan's tau function misses almost all primes"
    authors: [David Kurniadi Angdinata, Evan Chen, Chris Cummins, Ben Eltschig, Dejan Grubisic, Leopold Haller, Letong Hong, Andranik Kurghinyan, Kenny Lau, Hugh Leather, Seewoo Lee, Simon Mahns, Aram H. Markosyan, Rithikesh Muddana, Ken Ono, Manooshree Patel, Gaurang Pendharkar, Vedant Rathi, Alex Schneidman, Volker Seeker, Shubho Sengupta, Ishan Sinha, Jimmy Xin, Jujian Zhang]
    id: "https://arxiv.org/abs/2603.29970"
    type: "article"
    location: "Theorem 1, Lemma 4, Lemma 5"
    relationship: "formalizes"
    note: >
      The paper's appendix documents this repository, and records that AxiomProver was instructed
      to assume the $abc$ Conjecture and Proposition 5.4 of Xiong wherever needed.
  - title: "Prime values of Ramanujan's tau function"
    authors: [B. Xiong]
    id: "https://arxiv.org/abs/2311.12073"
    type: "article"
    location: "to appear in Proc. Amer. Math. Soc.; Prop. 5.4, Thm. 2.1, Prop. 2.2"
    relationship: "background"
    note: >
      Proposition 5.4, in the sharper $N^{1/2}$ form the paper states as Proposition 9, is a
      hypothesis of the Lean development. Theorem 2.1 and Proposition 2.2 of the same paper are
      the sources for Deligne's bound and the parity property in the axiomatization of $\tau$.
  - title: "La conjecture de Weil. I"
    authors: [P. Deligne]
    id: "https://doi.org/10.1007/BF02684373"
    type: "article"
    location: "Publ. Math. Inst. Hautes Etudes Sci. 43 (1974), 273-307, Theorem 8.2"
    relationship: "background"
    note: "Deligne's bound $|\\tau(p)| \\le 2p^{11/2}$, an axiom of `RamanujanTau`."

classification:
  arxiv: [math.NT]
  msc2020: [11F11, 11F30]

status:
  scope: >
    Theorem 1, Lemma 4 and Lemma 5, conditional on the $abc$ Conjecture and on Xiong's
    Proposition 5.4, both of which are hypotheses of the Lean statements. `problem.lean`
    axiomatizes $\tau$ as a structure `RamanujanTau` carrying Hecke multiplicativity, the Hecke
    recurrence, parity, Deligne's bound and the non-unit property, and every result is stated for
    an arbitrary such structure.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: [propext, Quot.sound, Classical.choice]
  main_results:
  - declaration: "reduction_lemma"
    file: "RamanujanTauMissesPrimes/solution.lean"
    sorry_count: 0
    axioms: [propext, Quot.sound, Classical.choice]
    comparator_config: "comparator.json"
    literature_dependencies:
    - statement: >
        `ABC`: for every $\varepsilon > 0$ there is $K_\varepsilon > 0$ such that
        $c \le K_\varepsilon \operatorname{rad}(abc)^{1+\varepsilon}$ for all coprime positive
        $a + b = c$.
      source: "abc Conjecture (unnumbered), as stated in the paper"
    - statement: >
        `Proposition5_4`: for large $N$ and $3 \le k < \log N / (2\log 2)$,
        $\#(\mathcal{P} \cap X_{2k} \cap [-N, N]) \ll N^{1/2}$; and
        $X_{2k} \cap [-N,N] = \varnothing$ for $k \ge \log N / (2 \log 2)$.
      source: "Proposition 9 (Xiong); Prime values of Ramanujan's tau function, Prop. 5.4"
    - statement: >
        `RamanujanTau`: $\tau$ is taken as any function satisfying Hecke multiplicativity and the
        Hecke recurrence, parity, Deligne's bound, and $\tau(n) \ne \pm 1$ for $n \ge 2$.
      source: "Equations (2.1), Proposition 6, and Deligne's bound as recorded by Xiong"
  - declaration: "abc_bound_E2"
    file: "RamanujanTauMissesPrimes/solution.lean"
    sorry_count: 0
    axioms: [propext, Quot.sound, Classical.choice]
    comparator_config: "comparator.json"
    literature_dependencies:
    - statement: "`ABC`, as above. This result does not involve $\\tau$."
      source: "abc Conjecture (unnumbered), as stated in the paper"
  - declaration: "abc_bound_E4"
    file: "RamanujanTauMissesPrimes/solution.lean"
    sorry_count: 0
    axioms: [propext, Quot.sound, Classical.choice]
    comparator_config: "comparator.json"
    literature_dependencies:
    - statement: "`ABC`, as above. This result does not involve $\\tau$."
      source: "abc Conjecture (unnumbered), as stated in the paper"
  - declaration: "main_theorem"
    file: "RamanujanTauMissesPrimes/solution.lean"
    sorry_count: 0
    axioms: [propext, Quot.sound, Classical.choice]
    comparator_config: "comparator.json"
    literature_dependencies:
    - statement: "`ABC`, `Proposition5_4` and `RamanujanTau`, as for `reduction_lemma`."
      source: "abc Conjecture; Proposition 9 (Xiong); Equations (2.1), Proposition 6, Deligne"

automation:
  methods:
    - method: "autonomous"
      models: [AxiomProver]

review:
  status: "author-verified"
  reviewers: [Kenny Lau]
  notes: >
    The formal problem statement in `RamanujanTauMissesPrimes/problem.lean` was checked against
    the source paper by an author of that paper.

alignment:
  statements:
    - source: "Lemma 4: $S(X) \\ll X^{13/22} + E_2(X) + E_4(X)$"
      lean: "reduction_lemma"
      module: "RamanujanTauMissesPrimes.solution"
      status: >
        Proved, in the weaker form
        $S(X) \ll X^{1/2}\log X + X^{13/22} + X^{6/11} + E_2(X) + E_4(X)$, which keeps the two
        terms the paper absorbs into $X^{13/22}$. The asymptotic $\ll$ is written out as explicit
        constants $C$ and $X_0$.
    - source: "Lemma 5(i): $E_2(X) \\ll_\\eta X^{4/9+\\eta}$"
      lean: "abc_bound_E2"
      module: "RamanujanTauMissesPrimes.solution"
      status: "Proved, with $\\ll_\\eta$ written out as explicit constants $C$ and $X_0$ per $\\eta$."
    - source: "Lemma 5(ii): $E_4(X) \\ll_\\eta X^{1/5+\\eta}$"
      lean: "abc_bound_E4"
      module: "RamanujanTauMissesPrimes.solution"
      status: "Proved, with $\\ll_\\eta$ written out as explicit constants $C$ and $X_0$ per $\\eta$."
    - source: "Theorem 1: assuming the $abc$ Conjecture, $S(X) = O(X^{13/22})$"
      lean: "main_theorem"
      module: "RamanujanTauMissesPrimes.solution"
      status: >
        Proved, with $O(X^{13/22})$ written out as explicit constants $C$ and $X_0$.
